# Render blueprint: New → Blueprint → pick this repository.
services:
  - type: web
    name: atmonsur-store
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/catalogue
    envVars:
      - key: NODE_VERSION
        value: "22.18.0"
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: PALMPAY_ENV
        value: sandbox
      - key: PALMPAY_APP_ID
        sync: false
      - key: PALMPAY_PRIVATE_KEY
        sync: false
      - key: PALMPAY_PUBLIC_KEY
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: NOTIFY_FROM
        sync: false
      - key: BANK_NAME
        sync: false
      - key: BANK_ACCOUNT_NUMBER
        sync: false
      - key: BANK_ACCOUNT_NAME
        sync: false
      - key: NODE_ENV
        value: production
